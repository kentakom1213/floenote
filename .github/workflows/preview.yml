name: Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update Preview
        id: preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          output="$(pnpm preview -- --name "$PREVIEW_NAME" --json)"
          printf '%s\n' "$output"

          web_url="$(OUTPUT="$output" node -p 'JSON.parse(process.env.OUTPUT).webUrl')"
          coordinator_url="$(OUTPUT="$output" node -p 'JSON.parse(process.env.OUTPUT).coordinatorUrl')"

          echo "web_url=$web_url" >> "$GITHUB_OUTPUT"
          echo "coordinator_url=$coordinator_url" >> "$GITHUB_OUTPUT"

      - name: Probe Preview
        shell: bash
        env:
          WEB_URL: ${{ steps.preview.outputs.web_url }}
          COORDINATOR_URL: ${{ steps.preview.outputs.coordinator_url }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 "$WEB_URL/" >/dev/null
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 "$COORDINATOR_URL/health" >/dev/null

      - name: Comment Preview URLs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WEB_URL: ${{ steps.preview.outputs.web_url }}
          COORDINATOR_URL: ${{ steps.preview.outputs.coordinator_url }}
        run: |
          set -euo pipefail

          body="$(cat <<EOF
          <!-- floe-note-preview -->
          Cloudflare Preview updated for this PR.

          - Web: $WEB_URL
          - Coordinator: $COORDINATOR_URL
          EOF
          )"

          gh pr comment "$PR_NUMBER" --body "$body" --edit-last --create-if-none

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: pnpm preview:delete -- --name "$PREVIEW_NAME"
