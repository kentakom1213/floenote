name: verify-step-2a

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Print generated lockfile
        run: |
          echo "LOCKFILE_BEGIN"
          cat pnpm-lock.yaml
          echo "LOCKFILE_END"
      - run: pnpm typecheck
      - run: pnpm build
