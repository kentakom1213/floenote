name: PWA verification helper

on:
  push:
    branches:
      - platform/pwa-foundation

jobs:
  verify-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify generated PWA assets
        run: |
          python - <<'PY'
          import json
          import struct
          from pathlib import Path

          dist = Path("apps/web/dist")
          manifest_path = dist / "manifest.webmanifest"
          sw_path = dist / "sw.js"

          assert manifest_path.is_file(), "manifest.webmanifest was not generated"
          assert sw_path.is_file(), "sw.js was not generated"

          manifest = json.loads(manifest_path.read_text())
          assert manifest["name"] == "Floe Note"
          assert manifest["short_name"] == "Floe Note"
          assert manifest["start_url"] == "/"
          assert manifest["scope"] == "/"
          assert manifest["display"] == "standalone"
          assert manifest["background_color"] == "#f6f9fa"
          assert manifest["theme_color"] == "#f6f9fa"

          icons = {(icon["src"], icon["sizes"], icon.get("purpose")) for icon in manifest["icons"]}
          assert ("/pwa-192x192.png", "192x192", "any") in icons
          assert ("/pwa-512x512.png", "512x512", "any") in icons
          assert ("/pwa-maskable-512x512.png", "512x512", "maskable") in icons

          expected_sizes = {
              "pwa-192x192.png": (192, 192),
              "pwa-512x512.png": (512, 512),
              "pwa-maskable-512x512.png": (512, 512),
              "apple-touch-icon.png": (180, 180),
          }
          for name, expected in expected_sizes.items():
              data = (dist / name).read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"{name} is not PNG"
              size = struct.unpack(">II", data[16:24])
              assert size == expected, f"{name}: expected {expected}, got {size}"

          sw = sw_path.read_text()
          for expected in [
              "index.html",
              "manifest.webmanifest",
              "pwa-192x192.png",
              "pwa-512x512.png",
              "pwa-maskable-512x512.png",
          ]:
              assert expected in sw, f"{expected} is not in the precache manifest"
          PY

      - name: Install browser verification helper
        run: python -m pip install --quiet websocket-client

      - name: Build browser fixture A
        run: |
          rm -rf apps/web/dist
          VITE_WEB_VERSION=0.4.0 VITE_WEB_BUILD=pwa-fixture-a pnpm --filter @floe-note/web exec vite build

      - name: Start preview and Chromium
        run: |
          pnpm --filter @floe-note/web exec vite preview --host 127.0.0.1 --port 4173 >/tmp/floe-preview.log 2>&1 &
          echo $! >/tmp/floe-preview.pid
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-allow-origins='*' --remote-debugging-port=9222 --user-data-dir=/tmp/floe-pwa-chrome about:blank >/tmp/floe-chrome.log 2>&1 &
          echo $! >/tmp/floe-chrome.pid
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:9222/json >/dev/null && break
            sleep 1
          done

      - name: Verify installability and offline shell
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          import websocket

          tabs = json.load(urllib.request.urlopen("http://127.0.0.1:9222/json"))
          page = next(tab for tab in tabs if tab.get("type") == "page")
          ws = websocket.create_connection(page["webSocketDebuggerUrl"], timeout=10, origin="http://127.0.0.1:9222")
          next_id = 0

          def call(method, params=None):
              global next_id
              next_id += 1
              request_id = next_id
              ws.send(json.dumps({"id": request_id, "method": method, "params": params or {}}))
              while True:
                  message = json.loads(ws.recv())
                  if message.get("id") != request_id:
                      continue
                  if "error" in message:
                      raise RuntimeError(f"{method}: {message['error']}")
                  return message.get("result", {})

          def evaluate(expression):
              result = call("Runtime.evaluate", {
                  "expression": expression,
                  "awaitPromise": True,
                  "returnByValue": True,
              })
              return result["result"].get("value")

          call("Page.enable")
          call("Network.enable")
          call("Runtime.enable")
          call("Page.navigate", {"url": "http://127.0.0.1:4173/"})
          time.sleep(5)

          manifest = call("Page.getAppManifest")
          manifest_errors = manifest.get("errors", [])
          assert not [error for error in manifest_errors if error.get("critical", False)], manifest_errors

          installability = call("Page.getInstallabilityErrors").get("installabilityErrors", [])
          assert installability == [], installability

          state = evaluate("navigator.serviceWorker.ready.then(r => r.active && r.active.state)")
          assert state == "activated", state

          call("Page.reload")
          time.sleep(3)
          assert evaluate("navigator.serviceWorker.controller !== null") is True

          call("Network.emulateNetworkConditions", {
              "offline": True,
              "latency": 0,
              "downloadThroughput": 0,
              "uploadThroughput": 0,
          })
          call("Page.reload")
          time.sleep(3)
          assert evaluate("document.title") == "Floe Note"
          assert evaluate("document.getElementById('root') !== null") is True

          invitation = "http://127.0.0.1:4173/join/v1/0123456789abcdef0123456789abcdef#s=test-secret"
          call("Page.navigate", {"url": invitation})
          time.sleep(3)
          assert evaluate("document.title") == "Floe Note"
          assert evaluate("location.pathname") == "/join/v1/0123456789abcdef0123456789abcdef"
          assert evaluate("location.hash") == "#s=test-secret"

          call("Network.emulateNetworkConditions", {
              "offline": False,
              "latency": 0,
              "downloadThroughput": -1,
              "uploadThroughput": -1,
          })
          call("Page.navigate", {"url": "http://127.0.0.1:4173/"})
          time.sleep(2)
          evaluate("window.__floeUpdateSentinel = 'editing-session-preserved'")
          script = evaluate("document.querySelector('script[type=module][src]')?.src")
          assert script
          open("/tmp/floe-script-a", "w").write(script)
          ws.close()
          PY

      - name: Deploy browser fixture B
        run: |
          rm -rf apps/web/dist
          VITE_WEB_VERSION=0.4.0 VITE_WEB_BUILD=pwa-fixture-b pnpm --filter @floe-note/web exec vite build

      - name: Verify prompt update lifecycle
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          import websocket

          tabs = json.load(urllib.request.urlopen("http://127.0.0.1:9222/json"))
          page = next(tab for tab in tabs if tab.get("type") == "page")
          ws = websocket.create_connection(page["webSocketDebuggerUrl"], timeout=10, origin="http://127.0.0.1:9222")
          next_id = 1000

          def call(method, params=None):
              global next_id
              next_id += 1
              request_id = next_id
              ws.send(json.dumps({"id": request_id, "method": method, "params": params or {}}))
              while True:
                  message = json.loads(ws.recv())
                  if message.get("id") != request_id:
                      continue
                  if "error" in message:
                      raise RuntimeError(f"{method}: {message['error']}")
                  return message.get("result", {})

          def evaluate(expression):
              result = call("Runtime.evaluate", {
                  "expression": expression,
                  "awaitPromise": True,
                  "returnByValue": True,
              })
              return result["result"].get("value")

          call("Runtime.enable")
          evaluate("navigator.serviceWorker.getRegistration().then(r => r.update())")

          deadline = time.time() + 20
          banner = None
          while time.time() < deadline:
              banner = evaluate("document.querySelector('.pwa-update-banner')?.textContent")
              if banner:
                  break
              time.sleep(0.5)

          assert banner and "A new version of Floe Note is available." in banner, banner
          assert evaluate("window.__floeUpdateSentinel") == "editing-session-preserved"

          script_a = open("/tmp/floe-script-a").read().strip()
          assert evaluate("document.querySelector('script[type=module][src]')?.src") == script_a

          evaluate("document.querySelector('.pwa-update-banner button').click()")

          deadline = time.time() + 20
          script_b = script_a
          while time.time() < deadline:
              time.sleep(0.5)
              try:
                  script_b = evaluate("document.querySelector('script[type=module][src]')?.src")
              except Exception:
                  continue
              if script_b and script_b != script_a:
                  break

          assert script_b and script_b != script_a, (script_a, script_b)
          assert evaluate("window.__floeUpdateSentinel") is None
          assert evaluate("document.title") == "Floe Note"
          ws.close()
          PY

      - name: Stop browser verification processes
        if: always()
        run: |
          test ! -f /tmp/floe-chrome.pid || kill "$(cat /tmp/floe-chrome.pid)" || true
          test ! -f /tmp/floe-preview.pid || kill "$(cat /tmp/floe-preview.pid)" || true
