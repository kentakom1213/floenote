name: PWA icon helper

on:
  push:
    branches:
      - platform/pwa-foundation

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rasterizer
        run: python -m pip install --quiet cairosvg

      - name: Generate PWA icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg

          public = Path("apps/web/public")
          favicon = (public / "favicon.svg").read_text()
          cairosvg.svg2png(bytestring=favicon.encode(), write_to=str(public / "pwa-192x192.png"), output_width=192, output_height=192)
          cairosvg.svg2png(bytestring=favicon.encode(), write_to=str(public / "pwa-512x512.png"), output_width=512, output_height=512)
          cairosvg.svg2png(bytestring=favicon.encode(), write_to=str(public / "apple-touch-icon.png"), output_width=180, output_height=180)

          maskable = """<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <defs>
              <linearGradient id="sea" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
                <stop stop-color="#1768B1"/>
                <stop offset="1" stop-color="#0B3D91"/>
              </linearGradient>
              <linearGradient id="ice" x1="27" y1="22" x2="38" y2="39" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FFFFFF"/>
                <stop offset="1" stop-color="#EAF7FF"/>
              </linearGradient>
            </defs>
            <rect width="64" height="64" fill="url(#sea)"/>
            <g transform="translate(7 8) scale(.78)">
              <path d="M13 30 18 23 31 18 39 20 50 26 52 31 45 35 28 38 16 34Z" fill="#052F68" opacity=".3" transform="translate(0 11)"/>
              <path d="M13 30 18 23 31 18 39 20 50 26 52 31 45 35 28 38 16 34Z" fill="url(#ice)"/>
              <path d="M16 34 28 38 28 46 16 40Z" fill="#A7D8FF"/>
              <path d="M28 38 45 35 44 42 28 46Z" fill="#86C9F4"/>
              <path d="M45 35 52 31 51 38 44 42Z" fill="#69B7E8"/>
            </g>
          </svg>"""
          cairosvg.svg2png(bytestring=maskable.encode(), write_to=str(public / "pwa-maskable-512x512.png"), output_width=512, output_height=512)
          PY

      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/pwa-192x192.png apps/web/public/pwa-512x512.png apps/web/public/pwa-maskable-512x512.png apps/web/public/apple-touch-icon.png
          git commit -m "Add Floe Note PWA icons"
          git push
