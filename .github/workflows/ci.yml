name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      verify_required: ${{ steps.filter.outputs.verify_required }}
      e2e_required: ${{ steps.filter.outputs.e2e_required }}
    steps:
      - name: Classify changes
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "verify_required=true" >> "$GITHUB_OUTPUT"
            echo "e2e_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          verify_required=false
          e2e_required=false

          while IFS= read -r path; do
            case "$path" in
              docs/*|*.md|.github/ISSUE_TEMPLATE/*)
                ;;
              *)
                verify_required=true
                ;;
            esac

            case "$path" in
              apps/web/src/*|apps/web/public/*|apps/web/index.html|apps/web/package.json|apps/web/vite.config.*|apps/web/wrangler.jsonc|apps/coordinator/src/*|apps/coordinator/package.json|apps/coordinator/wrangler.jsonc|packages/*/src/*|packages/*/package.json|e2e/*|playwright.config.*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.github/workflows/ci.yml)
                e2e_required=true
                ;;
            esac
          done < <(
            gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename'
          )

          echo "verify_required=$verify_required" >> "$GITHUB_OUTPUT"
          echo "e2e_required=$e2e_required" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.verify_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  browser-e2e:
    needs:
      - changes
      - verify
    if: >-
      always() &&
      needs.changes.outputs.e2e_required == 'true' &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm e2e
