name: CI

on:
  push:
    branches:
      - feat/mvp-step-6a-test-foundation
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Emit generated lockfile
        if: always()
        run: |
          echo "FLOE_LOCKFILE_BEGIN"
          cat pnpm-lock.yaml
          echo "FLOE_LOCKFILE_END"
