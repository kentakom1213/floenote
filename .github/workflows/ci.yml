name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verify_required: ${{ steps.filter.outputs.verify_required }}
      e2e_required: ${{ steps.filter.outputs.e2e_required }}
      e2e_mode: ${{ steps.filter.outputs.e2e_mode }}
      e2e_specs: ${{ steps.filter.outputs.e2e_specs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify changes
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            printf 'verify_required=true\ne2e_required=true\ne2e_mode=all\ne2e_specs=[]\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A failed API request must fail this job, not appear as an empty diff.
          gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/files" > "$RUNNER_TEMP/changed-files.json"
          node scripts/select-e2e.mjs "$RUNNER_TEMP/changed-files.json" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.verify_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  browser-e2e:
    needs:
      - changes
      - verify
    if: >-
      always() &&
      needs.changes.outputs.e2e_required == 'true' &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        shell: bash
        env:
          E2E_MODE: ${{ needs.changes.outputs.e2e_mode }}
          E2E_SPECS_JSON: ${{ needs.changes.outputs.e2e_specs }}
        run: |
          set -euo pipefail
          case "$E2E_MODE" in
            all)
              pnpm e2e
              ;;
            selected)
              jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<< "$E2E_SPECS_JSON" >/dev/null
              mapfile -t specs < <(jq -r '.[]' <<< "$E2E_SPECS_JSON")
              pnpm e2e "${specs[@]}"
              ;;
            *)
              echo "Unexpected E2E mode: $E2E_MODE" >&2
              exit 1
              ;;
          esac

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/results.json
            test-results/
          if-no-files-found: warn
          retention-days: 7
